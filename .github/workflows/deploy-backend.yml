name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets are set
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$ADMIN_PASSWORD" ] || missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy. Add these repository secrets first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ${#ADMIN_PASSWORD} -lt 12 ]; then echo "::error::ADMIN_PASSWORD must be at least 12 characters"; exit 1; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Find or create the database
        if: steps.check.outputs.ready == 'true'
        run: |
          id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="gallery-ear") | .uuid')
          if [ -z "$id" ]; then
            $WRANGLER d1 create gallery-ear
            id=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="gallery-ear") | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the D1 database"; exit 1; }
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$id/" wrangler.toml
          echo "Database: $id"

      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        run: $WRANGLER d1 migrations apply gallery-ear --remote

      - name: Deploy the worker
        if: steps.check.outputs.ready == 'true'
        run: $WRANGLER deploy | tee deploy.log

      - name: Store secrets in the worker
        if: steps.check.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | $WRANGLER secret put ANTHROPIC_API_KEY
          printf '%s' "$ADMIN_PASSWORD" | $WRANGLER secret put ADMIN_TOKEN

      - name: Show the backend address
        if: steps.check.outputs.ready == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "BACKEND_URL=$url"
          echo "### Backend live at $url" >> "$GITHUB_STEP_SUMMARY"
